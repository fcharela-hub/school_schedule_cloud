.class-selector-bar { background: #2c3e50; color: white; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; }

#class-select, #day-select { padding: 8px 16px; font-size: 16px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; color: #2c3e50; background: white; }

.mode-selector { background: #34495e; padding: 6px 12px; border-radius: 8px; display: flex; align-items: center; gap: 8px; cursor: pointer; border: 1px solid #4e6d8d; }
.mode-selector input { cursor: pointer; width: 18px; height: 18px; }

.app-container { display: flex; gap: 25px; max-width: 1400px; margin: 0 auto; align-items: flex-start; justify-content: center; } 

.schedule-section { flex: 0 1 560px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); } 
.lessons-section { flex: 1; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); min-width: 340px; max-width: 650px; max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; position: sticky; top: 20px; } 

.bank-group h3 { margin: 0 0 8px 0; color: #2c3e50; font-size: 16px; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; }

.instruction { font-size: 13px; color: #7f8c8d; text-align: center; margin-bottom: 10px; font-style: italic; } 

table { width: 100%; border-collapse: collapse; margin-bottom: 20px; table-layout: fixed; } 
th, td { border: 2px solid #e2e8f0; padding: 6px; text-align: center; height: 240px; max-height: 240px; vertical-align: middle; position: relative; overflow: hidden; } 
th { background-color: #34495e; color: white; font-weight: 600; height: 45px; font-size: 15px; } 

th:first-child,
td:first-child { width: 75px; } 
td:first-child { background-color: #edf2f7; font-weight: bold; color: #4a5568; height: auto; font-size: 16px; padding: 4px; } 

.lesson-card { padding: 4px; border-radius: 8px; color: #2c3e50; font-weight: bold; font-size: 12px; cursor: pointer; text-align: center; box-shadow: 0 3px 6px rgba(0,0,0,0.1); touch-action: manipulation; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid #bdc3c7; background: white; width: 100%; height: 100%; box-sizing: border-box; overflow: hidden; transition: transform 0.1s; } 
.lesson-card:active { transform: scale(0.97); }
.lesson-card.selected-card {
    box-shadow: 0 0 0 4px #e74c3c !important;
    background: #fdf2f2 !important;
}
.lesson-card.image-card img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 6px; display: block; background: #fff; margin: auto; }
.lesson-icon { font-size: 36px; } 
.lessons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; } 

.drop-zone { background-color: #f8fafc; transition: background 0.2s; cursor: pointer; height: 240px; max-height: 240px; box-sizing: border-box; overflow: hidden; } 
.drop-zone:hover { background-color: #edf2f7; }

.drop-zone .lesson-card {
    height: 224px !important;
    max-height: 224px !important;
    width: 100% !important;
    margin: 0 auto;
    box-shadow: none;
    box-sizing: border-box;
    border-radius: 6px !important;
    background: #ffffff;
    cursor: default;
}
.drop-zone .lesson-card.image-card img {
    width: 100% !important;
    height: 100% !important;
    max-width: 100% !important;
    max-height: 100% !important;
    object-fit: contain !important;
    border-radius: 4px;
}

.double-zone { display: flex; gap: 6px; padding: 6px; align-items: center; justify-content: center; background-color: #f8fafc; height: 240px; box-sizing: border-box; }
.double-zone .sub-zone { flex: 1; height: 100%; max-height: 224px; border: 2px dashed #cbd5e1; border-radius: 6px; display: flex; align-items: center; justify-content: center; position: relative; background: #fff; overflow: hidden; cursor: pointer; }
.double-zone .sub-zone .lesson-card {
    height: 100% !important;
    max-height: 220px !important;
    width: 100% !important;
    margin: 0;
}
.double-zone .sub-zone .lesson-card.image-card img {
    width: 100% !important;
    height: 100% !important;
    object-fit: contain !important;
}

.triple-zone { display: flex; gap: 4px; padding: 6px; align-items: center; justify-content: center; background-color: #f8fafc; height: 240px; box-sizing: border-box; }
.triple-zone .sub-zone { flex: 1; height: 100%; max-height: 224px; border: 2px dashed #cbd5e1; border-radius: 6px; display: flex; align-items: center; justify-content: center; position: relative; background: #fff; overflow: hidden; cursor: pointer; }
.triple-zone .sub-zone .lesson-card {
    height: 100% !important;
    max-height: 220px !important;
    width: 100% !important;
    margin: 0;
}
.triple-zone .sub-zone .lesson-card.image-card img {
    width: 100% !important;
    height: 100% !important;
    object-fit: contain !important;
}

.break-row .drop-zone { background-color: #f0f7fa; }
.home-row td:first-child { background-color: #eafaf1; color: #27ae60; }

#reset-btn { display: block; width: 100%; padding: 14px; background-color: #e74c3c; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; } 
</style>

                if (originCard) {
                    let target = this;
                    if (this.classList.contains("double-zone") || this.classList.contains("triple-zone")) {
                        const sub = e.target.closest(".sub-zone");
                        if (sub) target = sub;
                        else target = this.querySelector(".sub-zone");
                    }
                    insertCardToZone(originCard, target); 
                    saveSchedule();
                }
            }); 
        }); 

        function insertCardToZone(originCard, target) { 
            const clone = originCard.cloneNode(true); 
            clone.setAttribute("data-origin-id", originCard.id || originCard.getAttribute("data-origin-id"));
            clone.id = ""; 
            clone.style.cursor = "default"; 
            clone.classList.remove("selected-card");
             
            clone.style.width = "100%"; 
            clone.style.height = "100%"; 
            clone.style.margin = "0"; 

            const delBtn = document.createElement("button"); 
            delBtn.className = "delete-item"; 
            delBtn.innerHTML = "&times;"; 
            delBtn.onclick = function(e) { 
                e.stopPropagation(); 
                this.parentElement.remove(); 
                saveSchedule();
            }; 
            clone.appendChild(delBtn); 
            target.innerHTML = ""; 
            target.appendChild(clone); 
        } 

        function saveSchedule() {
            const currentClass = classSelect.value;
            const currentDay = daySelect.value;
            const scheduleData = { layout: {}, cards: [] };
             
            document.querySelectorAll(".drop-zone").forEach(zone => {
                const row = zone.getAttribute("data-row");

                if (zone.classList.contains("double-zone")) scheduleData.layout[row] = "double";
                else if (zone.classList.contains("triple-zone")) scheduleData.layout[row] = "triple";
                else scheduleData.layout[row] = "single";

                if (zone.classList.contains("double-zone") || zone.classList.contains("triple-zone")) {
                    zone.querySelectorAll(".sub-zone").forEach(sub => {
                        const card = sub.querySelector(".lesson-card");
                        if (card) {
                            scheduleData.cards.push({
                                row: row,
                                sub: sub.getAttribute("data-sub"),
                                originId: card.getAttribute("data-origin-id")
                            });
                        }
                    });
                } else {
                    const card = zone.querySelector(".lesson-card");
                    if (card) {
                        scheduleData.cards.push({
                            row: row,
                            sub: null,
                            originId: card.getAttribute("data-origin-id")
                        });
                    }
                }
            });

            const scheduleRef = ref(db, `schedules/${currentClass}_${currentDay}`);
            set(scheduleRef, scheduleData);
        }

        function loadSchedule() {
            const currentClass = classSelect.value;
            const currentDay = daySelect.value;
            const scheduleRef = ref(db, `schedules/${currentClass}_${currentDay}`);

            onValue(scheduleRef, (snapshot) => {
                document.querySelectorAll(".drop-zone").forEach(zone => {
                    zone.className = "drop-zone";
                    zone.innerHTML = "";
                });

                const parsedData = snapshot.val();
                if (parsedData) {
                    if (parsedData.layout) {
                        for (const [row, type] of Object.entries(parsedData.layout)) {
                            const zone = document.querySelector(`.drop-zone[data-row="${row}"]`);
                            if (zone) {
                                if (type === "double") {
                                    zone.className = "drop-zone double-zone";
                                    zone.innerHTML = `<div class="sub-zone" data-sub="1"></div><div class="sub-zone" data-sub="2"></div>`;
                                } else if (type === "triple") {
                                    zone.className = "drop-zone triple-zone";
                                    zone.innerHTML = `<div class="sub-zone" data-sub="1"></div><div class="sub-zone" data-sub="2"></div><div class="sub-zone" data-sub="3"></div>`;
                                }
                            }
                        }
                    }

                    const cardsList = parsedData.cards || [];
                    cardsList.forEach(item => {
                        let target;
                        const zone = document.querySelector(`.drop-zone[data-row="${item.row}"]`);
                        if (zone) {
                            if (item.sub) target = zone.querySelector(`.sub-zone[data-sub="${item.sub}"]`);
                            else target = zone;
                            
                            const originalCard = document.getElementById(item.originId);
                            if (target && originalCard) {
                                insertCardToZone(originalCard, target);
                            }
                        }
                    });
                }
            });
        }

        classSelect.addEventListener("change", loadSchedule);
        daySelect.addEventListener("change", loadSchedule);

        document.getElementById("reset-btn").addEventListener("click", () => { 
            const currentClass = classSelect.value;
            const currentDay = daySelect.value;
            if (confirm(`Θέλετε να καθαρίσετε το πρόγραμμα για την ημέρα ${currentDay} (${currentClass});`)) {
                document.querySelectorAll(".drop-zone").forEach(zone => {
                    zone.className = "drop-zone";
                    zone.innerHTML = "";
                }); 
                const scheduleRef = ref(db, `schedules/${currentClass}_${currentDay}`);
                set(scheduleRef, null);
            }
        }); 

        loadSchedule();
    });
</script> 
</body> 
</html>
